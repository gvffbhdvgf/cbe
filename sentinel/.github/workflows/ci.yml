name: Sentinel CI

on:
  pull_request:
    paths:
      - 'sentinel/**'
  push:
    branches: [main, 'sentinel/**']
    paths:
      - 'sentinel/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sentinel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build-time placeholders only: dynamic routes are not executed during the build.
      # Never use production credentials in CI, and never run the app against these values.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://sentinel_ci:sentinel_ci@127.0.0.1:5432/sentinel_ci?sslmode=disable
          NEON_AUTH_BASE_URL: https://example.neon.tech/auth
          NEON_AUTH_COOKIE_SECRET: sentinel-ci-only-placeholder-secret-32-characters
